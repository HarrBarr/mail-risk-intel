# Dev overrides: hot reload with bind mounts.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build  -> http://localhost:5173
services:
  api:
    build:
      args:
        INSTALL_DEV: "1"
    command: ["uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_ENV: development
    volumes:
      - db-data:/data
      - ./data:/data/seed:ro
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests

  worker:
    build:
      args:
        INSTALL_DEV: "1"
    command: ["watchfiles", "python -m app.worker", "app"]
    environment:
      APP_ENV: development
    volumes:
      - db-data:/data
      - ./data:/data/seed:ro
      - ./backend/app:/app/app

  web:
    image: node:20-alpine
    build: !reset null
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_PROXY: http://api:8000
    ports: !override
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
