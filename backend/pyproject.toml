[project]
name = "mail-risk-intel"
version = "0.1.0"
description = "Mail Risk Intelligence: two chained LLM agents that extract, risk-score and graph incoming email."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-groq>=1.0",
    "langchain-ollama>=1.0",
    "langchain-google-genai>=4.0",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.3",
    "tenacity>=8.5",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Paid providers are dev-only so the production image stays free-tier only.
dev = [
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "watchfiles>=0.24",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits a real LLM provider (opt-in: pytest -m live)"]
addopts = "-m 'not live'"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
